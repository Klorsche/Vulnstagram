{% extends "base.html" %}

{% block content %}
<div class="max-w-sm mx-auto border border-gray-800 mt-20 p-8 rounded-sm bg-black">
    <div class="flex flex-col items-center justify-center mb-10 mt-4 space-y-4">
        <img src="{{ url_for('static', filename='img/logo_icon.png') }}" alt="Vulnstagram Icon" class="w-24 h-24 object-contain">
        <img src="{{ url_for('static', filename='img/logo_text.png') }}" alt="Vulnstagram" class="w-48 h-auto object-contain">
    </div>
    
    <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
        
        <div>
            <input type="text" name="username" placeholder="Username" required class="w-full bg-gray-900 border border-gray-800 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-gray-500 text-white placeholder-gray-500">
        </div>
        
        <div>
            <input type="password" name="password" placeholder="Password" required class="w-full bg-gray-900 border border-gray-800 rounded-sm px-3 py-2 text-xs focus:outline-none focus:border-gray-500 text-white placeholder-gray-500">
        </div>
        
        <button type="submit" class="w-full bg-blue-500 text-white rounded-lg py-1.5 font-semibold text-sm hover:bg-blue-600 transition-colors mt-2">Log In</button>
    </form>
</div>

<div class="max-w-sm mx-auto border border-gray-800 mt-4 p-5 text-center rounded-sm text-sm">
    Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-blue-500 font-semibold">Sign up</a>
</div>
{% endblock %}
