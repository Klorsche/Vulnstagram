version: '3.8'

services:
  web:
    build: .
    ports:
      - "5001:5000"
    volumes:
      - .:/app
      # Volume per gli upload persistenti
      - ./app/static/uploads:/app/app/static/uploads
    environment:
      - FLASK_APP=run.py
      - FLASK_DEBUG=1
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: vulnlab_db
      MYSQL_USER: vulnlab_user
      MYSQL_PASSWORD: vulnlab_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
